# Render Blueprint for SERVIO.
# https://render.com/docs/blueprint-spec
#
# Usage:
#   1. Push this repo to GitHub/GitLab.
#   2. In the Render dashboard, choose "New > Blueprint" and point it at the repo.
#   3. Render will read this file and create the web service below. You'll be prompted to fill in
#      every env var marked `sync: false` (these are secrets/config that must not live in git).
#   4. After the first deploy, set REACT_APP_MARKETPLACE_ROOT_URL to the real Render/custom domain
#      URL and redeploy (it can't be known until Render assigns the URL, or you attach your domain).
#
# This app is a custom Node/Express server with server-side rendering (not a static site), so it
# must run as a Render "web service", not a "static site".

services:
  - type: web
    name: servio
    runtime: node
    plan: free # NOTE: Render free web services spin down after 15 min idle and cold-start on the next request. Fine for setup/testing - bump to starter/standard/pro before real launch traffic (Render pricing page).
    region: ohio # closest Render region to western KY / southern IN; change if you deploy elsewhere
    branch: main
    buildCommand: yarn install --production=false && yarn build
    startCommand: yarn start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.22.2
      - key: NODE_ENV
        value: production
      - key: REACT_APP_ENV
        value: production

      # --- Required: fill these in via the Render dashboard (not committed to git) ---
      - key: REACT_APP_SHARETRIBE_SDK_CLIENT_ID
        sync: false
      - key: SHARETRIBE_SDK_CLIENT_SECRET
        sync: false
      - key: REACT_APP_STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: REACT_APP_MAPBOX_ACCESS_TOKEN
        sync: false
      - key: REACT_APP_MARKETPLACE_ROOT_URL
        sync: false # set to https://<your-service>.onrender.com or your custom domain

      # --- Branding (safe defaults, override if needed) ---
      - key: REACT_APP_MARKETPLACE_NAME
        value: SERVIO

      # --- Recommended production hardening ---
      - key: REACT_APP_CSP
        value: block
      - key: SERVER_SHARETRIBE_TRUST_PROXY
        value: 'true'
      - key: REACT_APP_SHARETRIBE_USING_SSL
        value: 'true'
      - key: SERVER_SHARETRIBE_REDIRECT_SSL
        value: 'true'

      # --- Optional integrations: uncomment/add via dashboard as needed ---
      # - key: REACT_APP_GOOGLE_ANALYTICS_ID
      #   sync: false
      # - key: REACT_APP_SENTRY_DSN
      #   sync: false
      # - key: BILLZY_API_URL
      #   sync: false
      # - key: BILLZY_API_KEY
      #   sync: false
      # - key: REACT_APP_BILLZY_ENABLED
      #   value: 'true'
